[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "invoice-parser-llm"
version = "0.1.0"
description = "Turn invoice and receipt PDFs/images into validated, structured JSON with any OpenAI-compatible LLM."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Quantum Dev" }]
keywords = ["invoice", "receipt", "pdf", "ocr", "llm", "document-ai", "data-extraction", "openai", "ollama", "pydantic"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Topic :: Text Processing",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "pdfplumber>=0.11",
  "pypdf>=4.0",
  "pillow>=10.0",
  "typer>=0.12",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
]
dev = [
  "invoice-parser-llm[api]",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "fpdf2>=2.7",
]

[project.scripts]
invoice-parser = "invoice_parser_llm.cli:app"

[project.urls]
Homepage = "https://github.com/Quantum-dev1/invoice-parser-llm"
Issues = "https://github.com/Quantum-dev1/invoice-parser-llm/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_parser_llm"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  # Emitted by starlette.testclient itself, not by this project.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["invoice_parser_llm"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "PT018", "RUF012"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["invoice_parser_llm"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "pypdf.*"]
ignore_missing_imports = true
